<!DOCTYPE html><html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gujarati Steno Practice</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:#eaf2ff;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:750px;margin:35px auto}
header{text-align:center;margin-bottom:28px}
header h1{color:#38bdf8;font-size:30px}
header p{color:#94a3b8}
.card{
 background:#111c30;border:1px solid #263b5b;
 border-radius:18px;padding:22px;margin-bottom:20px;
}
label{display:block;margin:15px 0 8px;color:#cbd5e1}
textarea,select{
 width:100%;padding:14px;border-radius:10px;
 background:#080f20;color:white;border:1px solid #334b70;
 font-size:16px;
}
textarea{min-height:220px;resize:vertical;line-height:1.8}
.stats{display:flex;justify-content:space-between;color:#38bdf8;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
button{
 width:100%;padding:15px;border:0;border-radius:10px;
 background:#0284c7;color:white;font-size:17px;
 font-weight:bold;margin-top:20px;cursor:pointer;
}
button:active{opacity:.8}
.note{color:#94a3b8;font-size:13px;line-height:1.6}
@media(max-width:500px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>ગુજરાતી સ્ટેનો પ્રેક્ટિસ</h1>
<p>Personal Gujarati Dictation Practice</p>
</header><div class="card">
<h2>📝 તમારો પેરાગ્રાફ</h2>
<label for="paragraph">ગુજરાતી લખાણ અહીં Paste કરો</label>
<textarea id="paragraph" placeholder="તમારો ગુજરાતી પેરાગ્રાફ અહીં લખો અથવા પેસ્ટ કરો..."></textarea>
<div class="stats">
<span>કુલ શબ્દો</span>
<strong id="wordCount">0</strong>
</div>
</div><div class="card">
<h2>🎧 Audio Settings</h2>
<div class="row">
<div>
<label for="voice">Voice પસંદ કરો</label>
<select id="voice">
<option value="male">Male Voice</option>
<option value="female">Female Voice</option>
</select>
</div>
<div>
<label for="speed">Speed પસંદ કરો</label>
<select id="speed">
<option value="60">60 WPM</option>
<option value="80">80 WPM</option>
<option value="90">90 WPM</option>
<option value="110">110 WPM</option>
</select>
</div>
</div>
<button id="generate">Generate Audio</button>
<div id="audioSection" style="display:none;margin-top:20px">
  <audio id="audioPlayer" controls style="width:100%"></audio>
  <button id="restartAudio" type="button">Restart Audio</button>
  <a id="downloadAudio" download="gujarati-dictation.wav"
     style="display:block;color:#38bdf8;margin-top:15px">
     Download Audio
  </a>
</div>
<p id="status" class="note"></p>
</div> 
</div><script>
const paragraph=document.getElementById('paragraph');
const wordCount=document.getElementById('wordCount');

function countWords(text){
 const words=text.trim().match(/\S+/gu);
 return words ? words.length : 0;
}

paragraph.addEventListener('input',()=>{
 wordCount.textContent=countWords(paragraph.value);
});

let audioUrl = null;

document.getElementById('generate').addEventListener('click', async () => {
  const text = paragraph.value.trim();
  const status = document.getElementById('status');
  const section = document.getElementById('audioSection');
  const player = document.getElementById('audioPlayer');
  const download = document.getElementById('downloadAudio');

  if (!text) {
    alert('Please paste your Gujarati paragraph.');
    return;
  }

  status.textContent = 'Generating audio...';
  section.style.display = 'none';

  const button = document.getElementById('generate');
  button.disabled = true;

  try {
    const response = await fetch('/api/audio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text,
        voice: document.getElementById('voice').value,
        speed: Number(document.getElementById('speed').value)
      })
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.details || error.error || 'Audio generation failed');
    }

    const blob = await response.blob();

    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = URL.createObjectURL(blob);

    player.src = audioUrl;
    download.href = audioUrl;
    section.style.display = 'block';
    status.textContent = 'Audio ready!';

    await player.play();

  } catch (error) {
    status.textContent = 'Error: ' + error.message;
  } finally {
    button.disabled = false;
  }
});

document.getElementById('restartAudio').addEventListener('click', () => {
  const player = document.getElementById('audioPlayer');
  player.currentTime = 0;
  player.play();
});
</script></body>
</html>
